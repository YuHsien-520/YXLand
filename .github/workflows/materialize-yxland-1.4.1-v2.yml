name: Materialize YXLand 1.4.1 archive v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, glob, hashlib, re, sys
          files = sorted(glob.glob('bootstrap/1.4.1/part*.b64'))
          parts = []
          for path in files:
              text = open(path, 'r', encoding='utf-8').read()
              text = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              parts.append((path, text))
          data = ''.join(x[1] for x in parts)
          expected_len = 142528
          expected_sha = 'c77984766db75e534bd03cc88fb656f8051091caae7b868cfbd2deca15d5b686'
          extra = len(data) - expected_len
          print('parts=', len(parts), 'chars=', len(data), 'expected=', expected_len, 'extra=', extra)
          for p, s in parts:
              print(len(s), p)

          def check(label, candidate):
              if len(candidate) != expected_len:
                  return False
              try:
                  raw = base64.b64decode(candidate, validate=True)
              except Exception:
                  return False
              digest = hashlib.sha256(raw).hexdigest()
              if digest == expected_sha:
                  print('MATCH', label, digest)
                  open('/tmp/yxland-1.4.1-source-tree.tar.xz','wb').write(raw)
                  return True
              return False

          if check('as-is', data):
              sys.exit(0)
          if extra >= 0:
              if check('trim-tail', data[:expected_len]):
                  sys.exit(0)
              if check('trim-head', data[-expected_len:]):
                  sys.exit(0)
              pos = 0
              boundaries = [0]
              for _, s in parts:
                  pos += len(s)
                  boundaries.append(pos)
              for b in boundaries:
                  if b + extra <= len(data) and check('remove-after-boundary-%d' % b, data[:b] + data[b+extra:]):
                      sys.exit(0)
                  if b - extra >= 0 and check('remove-before-boundary-%d' % b, data[:b-extra] + data[b:]):
                      sys.exit(0)
          print('No SHA256-valid reconstruction found.')
          sys.exit(1)
          PY
          rm -rf /tmp/YXLand-1.4.1
          mkdir -p /tmp/YXLand-1.4.1
          tar -xJf /tmp/yxland-1.4.1-source-tree.tar.xz -C /tmp/YXLand-1.4.1

      - name: Verify and build 1.4.1
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/YXLand-1.4.1
          chmod +x test.sh build.sh
          ./test.sh
          ./build.sh
          javap -verbose build/classes/cn/yuxin/yxland/YXLandPlugin.class | grep 'major version: 52'
          if jar tf dist/YXLand-1.4.1.jar | grep -Eq '^(org/bukkit/|net/md_5/)'; then
            echo 'compile stubs leaked into plugin jar' >&2
            exit 1
          fi
          cd /tmp
          zip -qr YXLand-1.4.1-source.zip YXLand-1.4.1 -x 'YXLand-1.4.1/build/*' 'YXLand-1.4.1/dist/*'
          sha256sum /tmp/YXLand-1.4.1/dist/YXLand-1.4.1.jar /tmp/YXLand-1.4.1-source.zip > /tmp/SHA256SUMS-1.4.1.txt

      - name: Materialize archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf versions/1.4.1 current
          mkdir -p versions/1.4.1/source current/source
          cp /tmp/YXLand-1.4.1/dist/YXLand-1.4.1.jar versions/1.4.1/
          cp /tmp/YXLand-1.4.1-source.zip versions/1.4.1/YXLand-1.4.1-source.zip
          cp /tmp/SHA256SUMS-1.4.1.txt versions/1.4.1/SHA256SUMS.txt
          cp /tmp/YXLand-1.4.1/README.md versions/1.4.1/README.md
          cp /tmp/YXLand-1.4.1/TEST_REPORT.md versions/1.4.1/TEST_REPORT.md
          cp /tmp/YXLand-1.4.1/CHANGELOG.md versions/1.4.1/CHANGELOG.md
          rsync -a --exclude build --exclude dist /tmp/YXLand-1.4.1/ versions/1.4.1/source/
          cp /tmp/YXLand-1.4.1/dist/YXLand-1.4.1.jar current/
          cp /tmp/YXLand-1.4.1-source.zip current/YXLand-1.4.1-source.zip
          cp /tmp/SHA256SUMS-1.4.1.txt current/SHA256SUMS.txt
          rsync -a --exclude build --exclude dist /tmp/YXLand-1.4.1/ current/source/
          cp /tmp/YXLand-1.4.1/README.md README.md
          { cat /tmp/YXLand-1.4.1/CHANGELOG.md; echo; sed -n '/^## 1\.4\.0/,$p' CHANGELOG.md; } > /tmp/ROOT_CHANGELOG.md
          cp /tmp/ROOT_CHANGELOG.md CHANGELOG.md
          rm -rf bootstrap/1.4.1
          rm -f .github/workflows/materialize-yxland-1.4.1.yml .github/workflows/materialize-yxland-1.4.1-v2.yml

      - name: Commit archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'YXLand Archive Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'release: archive YXLand 1.4.1'
          git push
